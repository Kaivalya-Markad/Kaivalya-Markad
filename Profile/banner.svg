<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Kaivalya Markad - Frontend Developer, UI/UX, Graphic Design. A small animated bot waves hello." xmlns:c2pa="http://c2pa.org/manifest">
<style>
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.wave{transform-box:fill-box;transform-origin:0% 50%;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-50deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ant{animation:pulse 1.2s ease-in-out infinite}
.cur{animation:pulse 1s steps(2,start) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.shadow{transform-box:fill-box;transform-origin:center;animation:sh 3s ease-in-out infinite}
@keyframes sh{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.8)}}
.fl1{animation:fl 4s ease-in-out infinite}
.fl2{animation:fl 5s ease-in-out infinite reverse}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bub{transform-box:fill-box;transform-origin:left center;animation:pop 4s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
